name: Publish CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: cli-publish
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    if: github.repository == 'io7-cn/Quantum.Cli'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify release identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git merge-base --is-ancestor HEAD origin/main
          if ((git cat-file -t "refs/tags/$env:GITHUB_REF_NAME") -ne 'tag') { throw 'An annotated release tag is required.' }
          [xml]$project = Get-Content src/Quantum.Cli/Quantum.Cli.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match the project version.' }
          if (!$env:NUGET_USER) { throw 'Configure NUGET_USER and the matching NuGet trusted publisher first.' }
          "VERSION=$version" >> $env:GITHUB_ENV
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cli-package-ubuntu-latest
          path: artifacts/packages
      - run: cd artifacts/packages && sha256sum -c SHA256SUMS
      - uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish immutable package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/Quantum.Platform.Cli.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
